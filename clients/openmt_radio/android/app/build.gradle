plugins {
    id 'com.android.application'
}

android {
    namespace 'org.openmt.radio'
    compileSdk 34

    defaultConfig {
        applicationId 'org.openmt.radio'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// No libraries: the app uses only what Android itself has.
dependencies {
}
